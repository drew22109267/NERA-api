services:
  db:
    image: postgres:16-alpine
    container_name: hopital-db
    environment:
      POSTGRES_DB: hopital
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - hopital-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hopital"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  hopital-data:
